name: timecash
description: "Flowra - Offline planner & expense tracker for everyone — students, working professionals, and anyone managing their time and money."
publish_to: 'none'
version: 1.0.0+1
homepage: https://github.com/Itz30jay
repository: https://github.com/Itz30jay
issue_tracker: https://github.com/Itz30jay

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+2
  path: ^1.9.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  fl_chart: ^0.69.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  path_provider: ^2.1.4
  csv: ^6.0.0
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1E1B4B"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
